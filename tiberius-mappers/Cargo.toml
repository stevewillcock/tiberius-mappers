[package]
name = "tiberius-mappers"
description = "Row mappers for Tiberius"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true


[dependencies]
tiberius = { version = "0.12.3", default-features = false, optional = true }
tiberius_ng = { package = "tiberius-ng", version = "0.13", default-features = false, optional = true }
tiberius-mappers-derive = { version = "0.7.0", path = "../tiberius-mappers-derive" }

[features]
default = ["tiberius"]
tiberius = ["dep:tiberius"]
tiberius-ng = ["dep:tiberius_ng"]
